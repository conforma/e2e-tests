---
name: Compile E2E suite
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Compile all packages and tests
        run: go test -mod=readonly ./... -run '^$'
      - name: Dry-run the E2E suite
        run: go test -mod=readonly -v ./cmd -run '^TestE2E$' -args -ginkgo.dry-run -ginkgo.fail-on-empty -ginkgo.label-filter='ec || its-pipeline'
