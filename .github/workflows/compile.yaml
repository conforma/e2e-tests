---
name: Compile E2E suite
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Compile all packages and tests
        run: go test -mod=readonly ./... -run '^$'
      - name: Dry-run the E2E suite
        run: go test -mod=readonly -v ./cmd -run '^TestE2E$' -args -ginkgo.dry-run -ginkgo.fail-on-empty -ginkgo.label-filter='ec || its-pipeline'
