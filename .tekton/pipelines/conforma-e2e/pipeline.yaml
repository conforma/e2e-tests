---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: conforma-e2e-pipeline
spec:
  description: >-
    Provision Kind (AWS), deploy Konflux via operator, run conforma e2e tests,
    collect artifacts, and deprovision.
  params:
    - name: git-url
      type: string
      description: Git URL for conforma/e2e-tests
      default: https://github.com/conforma/e2e-tests.git
    - name: revision
      type: string
      description: Git commit SHA, branch, or tag to test
      default: main
    - name: konflux-ready-timeout
      type: string
      default: "30m"
    - name: oci-container-repo
      type: string
      description: >-
        OCI registry/repo prefix for artifacts (logs/state); PipelineRun name is appended as tag.
    - name: oci-container-repo-credentials-secret
      type: string
      description: >-
        Name of a Secret with registry credentials for oci-container-repo.
    - name: aws-credentials-secret
      type: string
      description: AWS credentials secret name for kind-aws-provision.
      default: mapt-kind-secret
    - name: deprovision-aws-credentials-secret
      type: string
      description: AWS secret for kind-aws-deprovision (often same as provision).
      default: mapt-kind-secret
    - name: konflux-ci-url
      type: string
      default: https://github.com/konflux-ci/konflux-ci.git
    - name: konflux-ci-revision
      type: string
      description: >-
        Pinned commit of konflux-ci for deploy-konflux task.
      # renovate: datasource=git-refs depName=https://github.com/konflux-ci/konflux-ci
      default: 61df3949abf2e8120505bc1ec05e3b9699566660
    - name: catalog-url
      type: string
      default: https://github.com/konflux-ci/tekton-integration-catalog.git
    - name: catalog-revision
      type: string
      description: >-
        Pinned commit of tekton-integration-catalog for kind-aws and other catalog tasks.
      # renovate: datasource=git-refs depName=https://github.com/konflux-ci/tekton-integration-catalog
      default: 77224106ecea32f1b0a01c68a8c8c97a70821800
    - name: custom-ec-cli-url
      type: string
      description: >-
        Git URL for a custom conforma/cli repo. When set with
        custom-ec-cli-revision, the pipeline builds the CLI from source
        and tests against it instead of the released image.
      default: ""
    - name: custom-ec-cli-revision
      type: string
      description: Git commit SHA or branch in the custom CLI repo.
      default: ""

  tasks:
    # ──────────────────────────────────────────────────────────────────────────
    # Infrastructure: provision cluster and deploy Konflux
    # ──────────────────────────────────────────────────────────────────────────
    - name: provision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/provision/0.2/kind-aws-provision.yaml
      params:
        - name: secret-aws-credentials
          value: $(params.aws-credentials-secret)
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: id
          value: $(context.pipelineRun.name)
        - name: tags
          value: owner=konflux-devprod@redhat.com,project=Konflux,created-by=conforma-e2e-pipeline
        - name: debug
          value: "false"
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: oci-ref
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-container-repo-credentials-secret)
        - name: cpus
          value: "16"
        - name: memory
          value: "32"
        - name: spot
          value: "false"
        - name: harden-control-plane
          value: "true"

    - name: deploy-konflux
      runAfter:
        - provision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.konflux-ci-url)
          - name: revision
            value: $(params.konflux-ci-revision)
          - name: pathInRepo
            value: .tekton/tasks/deploy-konflux/task.yaml
      params:
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: konflux-ready-timeout
          value: $(params.konflux-ready-timeout)
        - name: oci-container-repo
          value: $(params.oci-container-repo)
        - name: oci-container-repo-credentials-secret
          value: $(params.oci-container-repo-credentials-secret)
        - name: pipeline-run-name
          value: $(context.pipelineRun.name)

    # ──────────────────────────────────────────────────────────────────────────
    # E2E tests
    # ──────────────────────────────────────────────────────────────────────────
    - name: conforma-e2e-tests
      timeout: 3h
      runAfter:
        - deploy-konflux
      params:
        - name: git-url
          value: "$(params.git-url)"
        - name: git-revision
          value: "$(params.revision)"
        - name: oras-container
          value: "$(params.oci-container-repo):$(context.pipelineRun.name)"
        - name: cluster-access-secret-name
          value: kfg-$(context.pipelineRun.name)
        - name: custom-ec-cli-url
          value: "$(params.custom-ec-cli-url)"
        - name: custom-ec-cli-revision
          value: "$(params.custom-ec-cli-revision)"
      taskSpec:
        params:
          - name: git-url
            type: string
          - name: git-revision
            type: string
          - name: oras-container
            type: string
          - name: cluster-access-secret-name
            type: string
          - name: custom-ec-cli-url
            type: string
          - name: custom-ec-cli-revision
            type: string
        volumes:
          - name: konflux-ci-secrets-volume
            secret:
              secretName: konflux-e2e-secrets
          - name: konflux-infra-secrets-volume
            secret:
              secretName: konflux-test-infra
          - name: cluster-secret-volume
            secret:
              optional: true
              secretName: $(params.cluster-access-secret-name)
          - name: custom-cli-shared
            emptyDir: {}
        steps:
          - name: build-custom-cli
            # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/go-toolset
            image: registry.access.redhat.com/ubi9/go-toolset:9.7-1768393489@sha256:e8938564f866174a6d79e55dfe577c2ed184b1f53e91d782173fb69b07ce69ef
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            computeResources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi
            volumeMounts:
              - name: konflux-infra-secrets-volume
                mountPath: /usr/local/konflux-test-infra
                readOnly: true
              - name: custom-cli-shared
                mountPath: /shared
            env:
              - name: GOTOOLCHAIN
                value: auto
              - name: CUSTOM_EC_CLI_URL
                value: $(params.custom-ec-cli-url)
              - name: CUSTOM_EC_CLI_REVISION
                value: $(params.custom-ec-cli-revision)
            script: |
              #!/bin/bash
              set -euo pipefail

              if [ -z "${CUSTOM_EC_CLI_URL}" ] && [ -z "${CUSTOM_EC_CLI_REVISION}" ]; then
                echo "No custom CLI requested, skipping."
                exit 0
              fi

              if [ -z "${CUSTOM_EC_CLI_URL}" ] || [ -z "${CUSTOM_EC_CLI_REVISION}" ]; then
                echo "ERROR: custom-ec-cli-url and custom-ec-cli-revision must be set together."
                exit 1
              fi

              echo "Building custom EC CLI from ${CUSTOM_EC_CLI_URL} @ ${CUSTOM_EC_CLI_REVISION}"

              WORK_DIR="$(mktemp -d)"
              export GOPATH="${WORK_DIR}/go"
              export GOCACHE="${WORK_DIR}/cache"
              mkdir -p "${GOPATH}" "${GOCACHE}"

              CLI_DIR="${WORK_DIR}/ec-cli"
              git clone "${CUSTOM_EC_CLI_URL}" "${CLI_DIR}"
              cd "${CLI_DIR}"
              git checkout "${CUSTOM_EC_CLI_REVISION}"

              CGO_ENABLED=0 go build -trimpath -o ec ./

              # renovate: datasource=go depName=github.com/google/go-containerregistry
              go install github.com/google/go-containerregistry/cmd/crane@v0.21.9

              CRANE_AUTH_DIR="$(mktemp -d)"
              cp /usr/local/konflux-test-infra/oci-storage-dockerconfigjson "${CRANE_AUTH_DIR}/config.json"
              export DOCKER_CONFIG="${CRANE_AUTH_DIR}"

              CLI_SHA="$(git rev-parse --short=12 HEAD)"
              CUSTOM_IMAGE="quay.io/conforma/e2e-tests:cli-pr-${CLI_SHA}"

              # renovate: datasource=docker depName=quay.io/conforma/cli
              CLI_BASE_IMAGE="quay.io/conforma/cli:latest@sha256:56f13aff4e812b9c6de92da8a15255a67cb2851bb2d08aa917248a904e49ead4"

              tar cf ec-layer.tar --transform='s|^ec$|usr/local/bin/ec|' ec
              "${GOPATH}/bin/crane" append \
                --base "${CLI_BASE_IMAGE}" \
                --new_layer ec-layer.tar \
                --new_tag "${CUSTOM_IMAGE}"

              echo "Pushed custom CLI image: ${CUSTOM_IMAGE}"

              # Pass outputs to the e2e-test step via shared volume
              echo "${CUSTOM_IMAGE}" > /shared/custom-cli-image
              cp -r "${CLI_DIR}/tasks" /shared/tasks

              EXPECTED_TASK="/shared/tasks/verify-enterprise-contract/0.1/verify-enterprise-contract.yaml"
              if [ ! -f "${EXPECTED_TASK}" ]; then
                echo "ERROR: Expected task YAML not found at ${EXPECTED_TASK}"
                exit 1
              fi

          - name: e2e-test
            # renovate: datasource=docker depName=registry.access.redhat.com/ubi9/go-toolset
            image: registry.access.redhat.com/ubi9/go-toolset:9.7-1768393489@sha256:e8938564f866174a6d79e55dfe577c2ed184b1f53e91d782173fb69b07ce69ef
            securityContext:
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            computeResources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 8Gi
            volumeMounts:
              - name: konflux-ci-secrets-volume
                mountPath: /usr/local/konflux-ci-secrets
                readOnly: true
              - name: cluster-secret-volume
                mountPath: /tmp/kubeconfig
                subPath: kubeconfig
              - name: custom-cli-shared
                mountPath: /shared
                readOnly: true
            env:
              - name: KUBECONFIG
                value: /tmp/kubeconfig
              - name: GOTOOLCHAIN
                value: auto
              - name: GOMAXPROCS
                value: "4"
              - name: ARTIFACT_DIR
                value: /tmp/artifact-dir
              - name: GIT_URL
                value: $(params.git-url)
              - name: GIT_REVISION
                value: $(params.git-revision)
              - name: E2E_TIMEOUT
                value: "60m"
              - name: TEST_ENVIRONMENT
                value: "upstream"
            onError: continue
            script: |
              #!/bin/bash
              set -euo pipefail

              SECRETS="/usr/local/konflux-ci-secrets"
              if [ -f "${SECRETS}/quay-token" ]; then
                export QUAY_TOKEN="$(cat "${SECRETS}/quay-token")"
              fi

              # Pick up custom CLI outputs from the build-custom-cli step
              if [ -f /shared/custom-cli-image ]; then
                export CUSTOM_EC_CLI_IMAGE="$(cat /shared/custom-cli-image)"
                export CUSTOM_EC_TASK_YAML="/shared/tasks/verify-enterprise-contract/0.1/verify-enterprise-contract.yaml"
                echo "Using custom CLI image: ${CUSTOM_EC_CLI_IMAGE}"
              fi

              WORK_DIR="$(mktemp -d)"
              export GOPATH="${WORK_DIR}/go"
              export GOCACHE="${WORK_DIR}/cache"
              mkdir -p "${ARTIFACT_DIR}" "${GOPATH}" "${GOCACHE}"

              git clone "${GIT_URL}" "${WORK_DIR}/e2e-tests"
              cd "${WORK_DIR}/e2e-tests"
              git checkout "${GIT_REVISION}"

              go mod download
              go install -mod=mod github.com/onsi/ginkgo/v2/ginkgo
              export PATH="${GOPATH}/bin:${PATH}"

              ginkgo -v \
                --no-color \
                --output-interceptor-mode=none \
                --fail-on-empty \
                --timeout="${E2E_TIMEOUT}" \
                --output-dir="${ARTIFACT_DIR}" \
                --junit-report=e2e-report.xml \
                --label-filter="ec" \
                ./cmd
          - name: secure-push-oci
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  # renovate: datasource=git-refs depName=https://github.com/konflux-ci/tekton-integration-catalog
                  value: 77224106ecea32f1b0a01c68a8c8c97a70821800
                - name: pathInRepo
                  value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
            params:
              - name: workdir-path
                value: /tmp/artifact-dir
              - name: oci-ref
                value: $(params.oras-container)
              - name: credentials-volume-name
                value: konflux-infra-secrets-volume
          - name: fail-if-any-step-failed
            ref:
              resolver: git
              params:
                - name: url
                  value: https://github.com/konflux-ci/tekton-integration-catalog.git
                - name: revision
                  # renovate: datasource=git-refs depName=https://github.com/konflux-ci/tekton-integration-catalog
                  value: 77224106ecea32f1b0a01c68a8c8c97a70821800
                - name: pathInRepo
                  value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
    # ──────────────────────────────────────────────────────────────────────────
    # Finally: deprovision
    # ──────────────────────────────────────────────────────────────────────────
  finally:
    - name: deprovision-kind-cluster
      taskRef:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: tasks/mapt-oci/kind-aws-spot/deprovision/0.1/kind-aws-deprovision.yaml
      params:
        - name: secret-aws-credentials
          value: $(params.deprovision-aws-credentials-secret)
        - name: id
          value: $(context.pipelineRun.name)
        - name: cluster-access-secret
          value: kfg-$(context.pipelineRun.name)
        - name: oci-container
          value: $(params.oci-container-repo):$(context.pipelineRun.name)
        - name: oci-credentials
          value: $(params.oci-container-repo-credentials-secret)
